<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Budgeting App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-container {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #ccc;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Budget Tracker</h1>

    <div class="form-container">
        <h3>Log New Transaction</h3>
        <form method="POST">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit">Save Transaction</button>
        </form>
    </div>

    <h2>Recent Transactions</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            {% for tx in transactions %}
            <tr>
                <td>{{ tx.date }}</td>
                <td>{{ tx.description }}</td>
                <td>${{ tx.amount }}</td>
                <td>{{ tx.get_category_display }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No transactions logged yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>

</html>
