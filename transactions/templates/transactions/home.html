<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennywise</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body class="bg-gray-50 font-sans p-6 md:p-10 text-gray-800">

    <div class="max-w-5xl mx-auto">
        <!-- Header Bar -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Pennywise</h1>
                <p class="text-sm text-gray-500 mt-1">Manage your income and expenses effortlessly.</p>
            </div>
            <button onclick="openModal('add')"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition flex items-center gap-2">
                <span>+</span> Add Transaction
            </button>
        </div>

        <!-- Dynamic Table Container (HTMX Target) -->
        <div id="table-container">
            {% include "transactions/_table.html" %}
        </div>
    </div>

    <!-- Transaction Modal Component -->
    <div id="transactionModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
            <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Log Transaction</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <form method="POST" action="{% url 'home' %}">
                {% csrf_token %}
                <input type="hidden" name="transaction_id" id="modal_transaction_id">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Date</label>
                        <input type="date" name="date" id="id_date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Description</label>
                        <input type="text" name="description" id="id_description" required placeholder="e.g. Groceries" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Amount ($)</label>
                            <input type="number" step="0.01" name="amount" id="id_amount" required placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Category</label>
                            <select name="category" id="id_category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                                {% for value, label in form.fields.category.choices %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-gray-500 uppercase">Notes (Optional)</label>
                            <span id="charCount" class="text-xs text-gray-400 font-medium">0/200</span>
                        </div>
                        <textarea name="notes" id="id_notes" rows="3" maxlength="200" oninput="updateCharCount()" placeholder="Enter transaction notes..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>

    <!-- External JS -->
    {% load static %}
    <script src="{% static 'js/modal.js' %}"></script>
</body>

</html>
